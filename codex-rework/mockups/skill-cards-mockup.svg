<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="1000" height="70" fill="url(#headerGrad)" stroke="#1e293b" />
  <text x="30" y="42" fill="#38bdf8" font-size="20" font-weight="900">波末技能配點：流派卡片化導向視覺規格 (SKILL ALLOCATION REDESIGN)</text>
  <text x="970" y="42" fill="#94a3b8" font-size="14" text-anchor="end">解決手機 24 節點迷宮問題</text>

  <!-- Wave Top Info -->
  <g transform="translate(50, 95)">
    <rect x="0" y="0" width="900" height="60" rx="12" fill="#0f172a" stroke="#334155" />
    <text x="25" y="36" fill="#f8fafc" font-size="18" font-weight="bold">第 1 波完成 · 戰鬥已暫停</text>
    <rect x="710" y="14" width="165" height="32" rx="8" fill="#451a03" stroke="#f59e0b" />
    <text x="792" y="35" fill="#fef08a" font-size="14" font-weight="900" text-anchor="middle">可用技能點：2 點</text>
  </g>

  <!-- Subtitle -->
  <text x="50" y="185" fill="#94a3b8" font-size="13">手機直向預設展示「三大推薦戰術流派」，新手一眼看懂；亦可一鍵展開完整 24 節點專家星圖：</text>

  <!-- THREE CARDS GRID -->
  <g transform="translate(50, 205)">

    <!-- CARD 1: 流派 A (清群掃蕩) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="340" rx="16" fill="url(#cardA)" stroke="#06b6d4" stroke-width="2" filter="url(#cardGlow)" />
      <!-- Tag -->
      <rect x="15" y="15" width="120" height="24" rx="6" fill="#0891b2" />
      <text x="75" y="31" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">流派 A · 清群掃蕩</text>
      <text x="260" y="31" fill="#22d3ee" font-size="12" text-anchor="end">★★★★★</text>

      <text x="15" y="70" fill="#f8fafc" font-size="17" font-weight="900">【連鎖電弧・散彈漫天】</text>
      <text x="15" y="95" fill="#94a3b8" font-size="12">大幅特化清怪覆蓋率，子彈附帶</text>
      <text x="15" y="113" fill="#94a3b8" font-size="12">感電爆裂與多重跳躍。</text>

      <!-- Key Nodes List -->
      <rect x="15" y="130" width="250" height="110" rx="8" fill="#042f2e" stroke="#0f766e" />
      <text x="25" y="155" fill="#5eead4" font-size="12" font-weight="bold">核心進程：</text>
      <text x="35" y="178" fill="#ccfbf1" font-size="11">✓ Lv.1 分流槍機 (+1 側翼彈道)</text>
      <text x="35" y="198" fill="#ccfbf1" font-size="11">✓ Lv.2 急速供彈 (+20% 射速)</text>
      <text x="35" y="218" fill="#fef08a" font-size="11" font-weight="bold">★ 終極：【超導電磁風暴】</text>

      <!-- Button -->
      <rect x="15" y="265" width="250" height="48" rx="10" fill="#0891b2" />
      <text x="140" y="295" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">一鍵選配此分支 (2 點)</text>
    </g>

    <!-- CARD 2: 流派 B (破盾狙殺) -->
    <g transform="translate(310, 0)">
      <rect x="0" y="0" width="280" height="340" rx="16" fill="url(#cardB)" stroke="#f59e0b" stroke-width="2" filter="url(#cardGlow)" />
      <!-- Tag -->
      <rect x="15" y="15" width="120" height="24" rx="6" fill="#b45309" />
      <text x="75" y="31" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">流派 B · 單體核爆</text>
      <text x="260" y="31" fill="#fbbf24" font-size="12" text-anchor="end">首領專克</text>

      <text x="15" y="70" fill="#f8fafc" font-size="17" font-weight="900">【破盾穿透・弱點暴擊】</text>
      <text x="15" y="95" fill="#94a3b8" font-size="12">對單體精英與首領傷害 +150%，</text>
      <text x="15" y="113" fill="#94a3b8" font-size="12">完全撕裂敵方護盾防護。</text>

      <!-- Key Nodes List -->
      <rect x="15" y="130" width="250" height="110" rx="8" fill="#292524" stroke="#78350f" />
      <text x="25" y="155" fill="#fcd34d" font-size="12" font-weight="bold">核心進程：</text>
      <text x="35" y="178" fill="#fef3c7" font-size="11">✓ Lv.1 裝甲裂解 (無視 50% 護甲)</text>
      <text x="35" y="198" fill="#fef3c7" font-size="11">✓ Lv.2 穿透彈頭 (貫穿直線敵人)</text>
      <text x="35" y="218" fill="#fef08a" font-size="11" font-weight="bold">★ 終極：【天基滅殺狙擊】</text>

      <!-- Button -->
      <rect x="15" y="265" width="250" height="48" rx="10" fill="#d97706" />
      <text x="140" y="295" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">一鍵選配此分支 (2 點)</text>
    </g>

    <!-- CARD 3: 流派 C (引力控場) -->
    <g transform="translate(620, 0)">
      <rect x="0" y="0" width="280" height="340" rx="16" fill="url(#cardC)" stroke="#a855f7" stroke-width="2" filter="url(#cardGlow)" />
      <!-- Tag -->
      <rect x="15" y="15" width="120" height="24" rx="6" fill="#7e22ce" />
      <text x="75" y="31" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">流派 C · 牽引時滯</text>
      <text x="260" y="31" fill="#c084fc" font-size="12" text-anchor="end">防崩必備</text>

      <text x="15" y="70" fill="#f8fafc" font-size="17" font-weight="900">【重力漩渦・極度時滯】</text>
      <text x="15" y="95" fill="#94a3b8" font-size="12">減速周圍敵人 60%，聚怪連攜，</text>
      <text x="15" y="113" fill="#94a3b8" font-size="12">蓄力怪打斷機率 100%。</text>

      <!-- Key Nodes List -->
      <rect x="15" y="130" width="250" height="110" rx="8" fill="#3b0764" stroke="#581c87" />
      <text x="25" y="155" fill="#d8b4fe" font-size="12" font-weight="bold">核心進程：</text>
      <text x="35" y="178" fill="#f3e8ff" font-size="11">✓ Lv.1 時滯立場 (全場減速 30%)</text>
      <text x="35" y="198" fill="#f3e8ff" font-size="11">✓ Lv.2 聚變引力 (強制拉扯怪物)</text>
      <text x="35" y="218" fill="#fef08a" font-size="11" font-weight="bold">★ 終極：【奇點塌縮黑洞】</text>

      <!-- Button -->
      <rect x="15" y="265" width="250" height="48" rx="10" fill="#7e22ce" />
      <text x="140" y="295" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">一鍵選配此分支 (2 點)</text>
    </g>

  </g>

  <!-- Bottom Switch to 24-node Expert Constellation -->
  <g transform="translate(50, 570)">
    <rect x="0" y="0" width="900" height="50" rx="10" fill="#0f172a" stroke="#334155" />
    <text x="30" y="30" fill="#94a3b8" font-size="13">🔍 想自定義微調節點？隨時可切換為原有「專家模式・24 節點完整網絡星圖」</text>
    <rect x="680" y="8" width="200" height="34" rx="6" fill="#1e293b" stroke="#64748b" />
    <text x="780" y="30" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">切換至 24 節點星圖 ➔</text>
  </g>
</svg>
